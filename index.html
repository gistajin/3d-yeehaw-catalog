<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Yeehaw — Model Catalog</title>
  <link rel="stylesheet" href="css/style.css">
  <script>
    (function() {
      try {
        var t = localStorage.getItem('theme');
        if (!t) t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>

<header>
  <div class="header-left">
    <img src="logo.svg" class="logo-mark" alt="3D Yeehaw">
    <div class="header-titles">
      <h1>3D Yeehaw</h1>
      <p>Models we can print</p>
    </div>
  </div>
  <button class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle dark mode">
    <svg class="theme-icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    <svg class="theme-icon-moon hidden" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
  </button>
</header>

<main>
  <div class="toolbar">
    <input type="text" id="search" placeholder="Search models..." oninput="handleSearch(this.value)">
  </div>

  <div id="catalog-breadcrumb" class="catalog-breadcrumb hidden"></div>
  <div id="catalog-loading">Loading models...</div>
  <div id="catalog-grid" class="catalog-grid"></div>
</main>

<footer>3D Yeehaw</footer>

<div id="lightbox" class="lightbox hidden" onclick="closeLightbox()">
  <img id="lightbox-img" alt="">
</div>

<script src="js/config.js"></script>
<script src="js/sheets.js"></script>
<script src="js/app.js"></script>
</body>
</html>
